[package]
name = "cust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cust-config-types = { path = "../cust-config-types" }
cust-config = { path = "../cust-config" }
cust-provider = { path = "../cust-provider" }
cust-tools-api = { path = "../cust-tools-api" }
cust-tools = { path = "../cust-tools" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "macros", "rt"] }
futures-util = "0.3"
async-stream = "0.3"
thiserror = "2.0"
anyhow = "1.0"
