[workspace]
resolver = "2"
members = [
    "crates/cust-config-types",
    "crates/cust-config",
    "crates/cust-provider",
    "crates/cust-exec",
    "crates/cust-codemode",
    "crates/cust-session",
    "crates/cust-tui",
    "crates/cust-proto",
    "crates/cust-skill",
    "crates/cust-tools-api",
    "crates/cust-tools",
    "crates/cust-core",
    "crates/cust-memory",
    "crates/cust-code",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jonusnattapong/cust-code"
